[package]
name = "photo-stamp-screensaver"
# Not the real version: that comes from the git tag (scripts/version.sh).
version = "0.0.0"
edition = "2024"
description = "A Windows screensaver that shows a folder of photos with where and when each was taken"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
chrono-tz = "0.10.4"
fastrand = "2.5.0"
img-parts = "0.4.1"
kamadak-exif = "0.6.1"
libheif-rs = { version = "3.0.0", optional = true }
memchr = "2.8.3"
# photo-stamp's place types, /v1 protocol, towns database reader and version ordering, from its
# public mirror (pinned: bump the rev to pick up protocol changes).
photo-stamp-proto = { git = "https://github.com/daterrell/photo-stamp", rev = "30c24e635e2614b57caad25b3d3a3102584d167a", features = ["places"] }
quick-xml = "0.42.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
tzf-rs = "2.1.2"
ureq = "3.4.2"
walkdir = "2.5.0"

[features]
# HEIC/HEIF through libheif, linked statically in the Windows build (docker/Dockerfile.windows).
heif = ["dep:libheif-rs"]

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
] }
# Direct2D's matrices; comes with `windows`.
windows-numerics = "0.3.1"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Graphics_Gdi",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
strip = true
